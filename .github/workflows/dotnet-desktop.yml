name: Agent Builds

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        configuration: [Release]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Build Agent Linux
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish Payload_Type/athena/athena/agent_code/Agent.sln -c Release --nologo -v q --property WarningLevel=0 /clp:ErrorsOnly -r linux-x64 /p:LinuxTest=True
    
    - name: Build Agent MacOS
      if: matrix.os == 'macos-latest'
      run: dotnet publish Payload_Type/athena/athena/agent_code/Agent.sln -c Release --nologo -v q --property WarningLevel=0 /clp:ErrorsOnly -r osx-x64 /p:MacTest=True
    
    - name: Build Agent Windows
      if: matrix.os == 'windows-latest'
      run: dotnet publish Payload_Type\athena\athena\agent_code\Agent.sln -c Release --nologo -v q --property WarningLevel=0 /clp:ErrorsOnly -r win-x64 /p:WindowsTest=True

    - name: Test Agent Linux
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test Payload_Type/athena/athena/agent_code/Tests/Agent.Tests/ -c Debug --nologo /p:LinuxTest=True /p:HandlerOS=linux /p:SolutionDir=""

    - name: Test assembly identity obfuscation
      if: matrix.os == 'ubuntu-latest'
      run: dotnet test Payload_Type/athena/athena/agent_code/Tests/AssemblyNameObfuscator.Tests/ -c Debug --nologo


    - name: Build Zoom profile integration
      if: matrix.os == 'ubuntu-latest'
      run: dotnet build Payload_Type/athena/athena/agent_code/AthenaCore/AthenaCore.csproj -c LocalDebugZoom --nologo /p:SolutionDir="" --property WarningLevel=0 /clp:ErrorsOnly

    - name: Test payload build pipeline
      if: matrix.os == 'ubuntu-latest'
      run: python3 -m unittest discover -s Payload_Type/athena/athena/agent_code/Tests -p "test_*.py"
    
    - name: Test Agent MacOS
      if: matrix.os == 'macos-latest'
      run: dotnet test Payload_Type/athena/athena/agent_code/Tests/Agent.Tests/ -c Debug --nologo /p:MacTest=True /p:SolutionDir=""
    
    - name: Test Agent Windows
      if: matrix.os == 'windows-latest'
      run: dotnet test Payload_Type\athena\athena\agent_code\Tests\Agent.Tests\ -c Debug --nologo /p:WindowsTest=True /p:SolutionDir=""

  focused-regressions:
    name: Focused regression - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
        - CommandLifecycle.Tests
        - CommandReliability.Tests
        - DataRouting.Tests
        - Lifecycle.Tests
        - MessageManager.Tests
        - NativeInterop.Tests
        - Obfuscator.Tests
        - PluginContract.Tests
        - ProfileReliability.Tests
        - Rportfwd.Tests
        - Socks.Tests
        - TaskManager.Tests

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Restore and test
      shell: bash
      run: |
        project="Payload_Type/athena/athena/agent_code/Tests/${{ matrix.project }}/${{ matrix.project }}.csproj"
        dotnet restore "$project" --nologo -p:RestoreFallbackFolders=
        dotnet test "$project" -c Debug --no-restore --nologo

  windows-native-regressions:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Run Windows native and lifecycle regressions
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet test Payload_Type\athena\athena\agent_code\Tests\NativeInterop.Tests\NativeInterop.Tests.csproj -c Debug --nologo
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test Payload_Type\athena\athena\agent_code\Tests\CommandLifecycle.Tests\CommandLifecycle.Tests.csproj -c Debug --nologo
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test Payload_Type\athena\athena\agent_code\Tests\Agent.Tests.Defender\Agent.Tests.Defender.csproj -c Debug --nologo
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

